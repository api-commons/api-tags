# API Platform
# An APIs.json (0.21) index of API Evangelist provider profiles. Each entry points at that
# provider's own apis.yml in the api-evangelist GitHub org, which in turn indexes their
# OpenAPI/AsyncAPI definitions. Built for tags.apicommons.org.
aid: api-platform
name: API Platform
description: The common tools an organization's API platform is built on and runs on — source control, CI/CD, cloud
  and container runtimes, infrastructure as code, identity, observability and incident response, data and event
  streaming, product analytics, communications, payments, and AI models. Each provider points at its API Evangelist
  profile, so the whole stack can be walked down to the individual OpenAPI and AsyncAPI definitions behind it.
